# ---------------------------------------------------------------------------
# Builds the Vue site in  website/  and publishes it to GitHub Pages.
# Runs automatically on every push to the `main` branch (and can be run by hand
# from the Actions tab via "Run workflow").
# ---------------------------------------------------------------------------
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you trigger it manually from the Actions tab

# Permissions the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, cancel the older run and keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build the site
        working-directory: website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (set to "GitHub Actions" source) if it isn't
          # already, so the build no longer fails with "Get Pages site failed".
          enablement: true

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
